# The Rust framework (rust/): format, lints, tests, supply chain. The Java build is separate
# (publish.yml runs it on tags); this workflow runs only when the Rust tree, the shared conformance
# vectors or this file change. Toolchain: rust/rust-toolchain.toml (keep the version below equal).
name: rust

on:
  push:
    branches: [main]
    paths: ["rust/**", "conformance/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "conformance/**", ".github/workflows/rust.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    # The tests' servers: fw-test uses these instead of starting containers itself.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      FW_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      FW_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace --all-features

  # The committed .sqlx/ must describe every checked query against the migrated schema.
  sqlx:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 20
    env:
      FW_SQL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features rustls,postgres
      - run: cargo run -p cargo-fw -- sql check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check
