# One PostgreSQL. Every value can be overridden by the environment variable named after its path,
# for example DATABASE_INSTANCES_MAIN_URL. Put the password in config/secrets.local.yaml (never
# committed) or in DATABASE_INSTANCES_MAIN_PASSWORD.

database:
  default: main
  instances:
    main:
      url: jdbc:postgresql://localhost:5432/app
      username: app
      password: ""
      pool: { max: 10, min-idle: 1, connect-timeout: 5s }
      migrate: true

# The platform. The service runs without it (no sync, no receivers, no notifications) unless it is
# switched on: FLOWCATALYST_ENABLED=true with FLOWCATALYST_BASE_URL, FLOWCATALYST_CLIENT_ID and
# FLOWCATALYST_CLIENT_SECRET (never committed). The subscription's target is a path on this
# service's own address as the platform sees it.
flowcatalyst:
  enabled: false
  application: tickets-trial
  subscription-target-base-url: http://localhost:8091
  # The platform signs deliveries with the secret of the subscription's connection:
  # FLOWCATALYST_RECEIVERS_SIGNING_SECRET (never committed).

# The service that sends the notifications; each client's own key is resolved at the time
# (TICKETS_NOTIFY_<CLIENT>__NOTIFY_KEY).
http-clients:
  instances:
    notifier:
      base-url: http://localhost:8099
