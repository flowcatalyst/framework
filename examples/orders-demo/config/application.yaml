# One PostgreSQL: its connection only. The pool and migrations are code (DatabaseModule's
# defaults). Every value can be overridden by the environment variable named after its path, for
# example DATABASE_INSTANCES_MAIN_URL. Put the password in config/secrets.local.yaml (never
# committed) or in DATABASE_INSTANCES_MAIN_PASSWORD.

database:
  default: main
  instances:
    main:
      url: jdbc:postgresql://localhost:5432/app
      username: app
      password: ""
