# One PostgreSQL. Every value can be overridden by the environment variable named after its path,
# for example DATABASE_INSTANCES_MAIN_URL. Put the password in config/secrets.local.yaml (never
# committed) or in DATABASE_INSTANCES_MAIN_PASSWORD.

database:
  default: main
  instances:
    main:
      url: jdbc:postgresql://localhost:5432/app
      username: app
      password: ""
      pool: { max: 10, min-idle: 1, connect-timeout: 5s }
      migrate: true

# The admin area's event types and roles read the platform as this application's service account.
# The demo runs without a platform unless it is switched on: FLOWCATALYST_ENABLED=true with
# FLOWCATALYST_BASE_URL, FLOWCATALYST_CLIENT_ID and FLOWCATALYST_CLIENT_SECRET (never committed).
flowcatalyst:
  enabled: false
  application: orders-demo
  receivers:
    enabled: false
