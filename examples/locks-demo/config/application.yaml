# Connections only: the pools and the three lock stores, one per driver, are code
# (LocksDemo.builder()). Every value can be overridden by the environment variable
# named after its path, for example DATABASE_INSTANCES_MAIN_URL or REDIS_INSTANCES_DEFAULT_URL.
# Put the database password in config/secrets.local.yaml (never committed) or in
# DATABASE_INSTANCES_MAIN_PASSWORD.

database:
  default: main
  instances:
    main:
      url: jdbc:postgresql://localhost:5432/app
      username: app
      password: ""

redis:
  default: default
  instances:
    default: { url: "redis://localhost:6379/0" }
