# The database and Redis instances (connections, with their pools) are configuration; the three
# lock stores, one per driver, are code (LocksDemo.builder()): an application can have many lock
# stores, each with its own driver. Every value can be overridden by the environment variable
# named after its path, for example DATABASE_INSTANCES_MAIN_URL or REDIS_INSTANCES_DEFAULT_URL.
# Put the database password in config/secrets.local.yaml (never committed) or in
# DATABASE_INSTANCES_MAIN_PASSWORD.

database:
  default: main
  instances:
    main:
      url: jdbc:postgresql://localhost:5432/app
      username: app
      password: ""
      pool: { max: 10, min-idle: 1, connect-timeout: 5s }
      migrate: true

redis:
  default: default
  instances:
    default: { url: "redis://localhost:6379/0", timeout: 2s }
