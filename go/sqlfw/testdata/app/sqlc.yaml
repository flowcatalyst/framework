version: "2"
sql:
  - engine: postgresql
    schema: [".fw/schema"]
    queries: queries
    database:
      uri: ${FW_SQL_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: db
        out: db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_db_tags: true
        overrides:
          - column: "things.id"
            go_type: "github.com/flowcatalyst/framework/go/sqlfw/testdata/app/types.ThingID"
          - column: "thing_tags.thing_id"
            go_type: "github.com/flowcatalyst/framework/go/sqlfw/testdata/app/types.ThingID"
