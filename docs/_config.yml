# GitHub Pages / Jekyll configuration for the documentation site. There is no build step of our
# own: Pages builds plain Markdown with the built-in minima theme. Pages is not enabled by this file.
title: FlowCatalyst application framework
description: A Java 25 framework for business applications that run next to the FlowCatalyst platform.
theme: minima

# Render Markdown files that have no YAML front matter, and turn links between .md files into
# working page links. Both plugins are on the GitHub Pages allow-list.
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

# Working notes, not documentation.
exclude:
  - research/
  - handover.md
  - guide/verify.sh
