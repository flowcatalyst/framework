# Site navigation: the sidebar, the previous/next links and the page titles all come from this file.
#
# To add a page: write the .md file, then add ONE line under the right group:
#
#   - { title: Page title, path: guide/my-page.md }
#
# `path` is relative to docs/ and must exist. Order here is the reading order (previous/next follow
# it). Every page under docs/guide/ must be listed; docs/guide/verify.sh fails otherwise, and it
# fails on a path that does not exist. Keep titles short: they are sidebar labels.
