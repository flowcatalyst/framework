# The shared UI workspace (docs/go/ui.md section 4; owner ruling 2026-10-14: the workspace lives
# under ui/, the library is @flowcatalyst/ui and other repositories consume it with a pnpm `link:`
# to ui/packages/ui, as TypeScript and Vue source).
packages:
  - packages/*
  - apps/*
  - samples/*

# Supply-chain rules (docs/go/ui.md section 2):
# - a version must have been on the registry for at least 7 days before pnpm resolves it
#   (minutes; 10080 = 7 days). This applies to transitive dependencies too.
minimumReleaseAge: 10080
# - no install scripts run except for the packages listed here. Nothing in this workspace needs one:
#   esbuild, rolldown, lightningcss and @tailwindcss/oxide ship prebuilt binaries as optional
#   dependencies. A new entry needs a reason in the commit message.
onlyBuiltDependencies: []
# Install scripts that exist in the tree and are deliberately not run (listed so pnpm does not warn):
# esbuild's postinstall only re-checks its platform binary (installed as an optional dependency);
# vue-demi's switches between Vue 2 and 3 builds and its default build is already Vue 3.
ignoredBuiltDependencies:
  - esbuild
  - vue-demi
# - exact versions when a dependency is added (`pnpm add` writes 4.11.3, never ^4.11.3).
savePrefix: ""
# - a peer dependency that does not match is an install error, not a warning.
strictPeerDependencies: true
# - nothing hoisted to the root node_modules: a workspace package imports only what it declares.
#   (pnpm's internal hoisting into node_modules/.pnpm/node_modules stays: Nuxt UI's type declarations
#   import `vue`, which it does not declare.)
publicHoistPattern: []

# @typescript/typescript6 6.0.2 declares `"@typescript/old": "npm:typescript@^6"`, a range; this pins
# the TypeScript 6 behind the JS API to one version.
overrides:
  "@typescript/typescript6>@typescript/old": npm:typescript@6.0.3

# Shared versions; a package refers to them as "catalog:".
catalog:
  "@nuxt/ui": 4.11.3
  "vue": 3.5.43
  "vue-router": 4.6.4
  "vite": 8.2.4
  "@vitejs/plugin-vue": 6.0.9
  "tailwindcss": 4.3.3
  # TypeScript 7 is the compiler, TypeScript 6 the JS API (owner ruling 2026-10-14: TypeScript 7). The
  # layout is the one the TypeScript 7.0 release notes give for running both side by side; which tool
  # runs on which, and when the 6 goes, is in ui/README.md ("Which TypeScript runs where").
  # - `@typescript/native` is TypeScript 7.0.2 under an alias. Its `tsc` (a Go binary from the
  #   matching @typescript/typescript-<os>-<arch> optional dependency) is the `tsc` of every script.
  #   7.0 has no programmatic API (only `typescript/unstable/*` IPC modules); nothing imports it.
  # - `typescript` is @typescript/typescript6, Microsoft's compatibility package: it re-exports the
  #   TypeScript 6 API of its dependency `@typescript/old` (pinned to typescript 6.0.3 in `overrides`)
  #   and has a `tsc6` binary, no `tsc`. What imports `typescript` or names it as a peer resolves
  #   here: typescript-eslint (type-aware lint), vue-tsc (.vue checks; 3.3.12 detects this package
  #   and patches @typescript/old's tsc) and @hey-api/openapi-ts (it prints the generated client with
  #   TypeScript's factory). Vite and @vitejs/plugin-vue do not use TypeScript.
  "@typescript/native": npm:typescript@7.0.2
  "typescript": npm:@typescript/typescript6@6.0.2
  "vue-tsc": 3.3.12
  "zod": 4.6.5
  "@iconify-json/lucide": 1.2.140
  "@fontsource-variable/inter": 5.3.0
  "@vueuse/core": 14.4.0
  "@internationalized/date": 3.12.4
  # The version @nuxt/ui 4.11.3 pins; @flowcatalyst/ui builds FwAlertDialog and FwToggleGroup on it.
  "reka-ui": 2.10.5
  "vitest": 5.0.3
  "@vue/test-utils": 2.5.1
  "happy-dom": 20.14.5
  "@playwright/test": 1.63.0
  "@axe-core/playwright": 4.13.0
  "@hey-api/openapi-ts": 0.99.0
  "@types/node": 24.19.1
