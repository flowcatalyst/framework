<div id="app-field" class="fc-form-field max-w-xs">
<span id="app-label" class="fc-field-label">Application</span>
<details class="fc-multiselect">
<summary class="fc-select fc-multiselect-trigger" aria-labelledby="app-label app-summary"><span id="app-summary" class="fc-multiselect-summary">Alpha</span></summary>
<div class="fc-multiselect-panel" data-signals:app-search="&#39;&#39;">
<input type="search" class="fc-input fc-multiselect-search" placeholder="Search" aria-label="Search Application" autocomplete="off" data-bind:app-search>
<div id="app-options" class="fc-multiselect-options" role="listbox" aria-labelledby="app-label">
<a class="fc-multiselect-option" role="option" href="/ui/apps/a" aria-selected="true" data-filter-text="alpha a" data-show="!$appSearch.trim() || el.dataset.filterText.includes($appSearch.trim().toLowerCase())" data-on:click__prevent="const d = el.closest(&#39;details&#39;); d.querySelector(&#39;.fc-multiselect-summary&#39;).textContent = el.textContent; d.querySelectorAll(&#39;[role=option]&#39;).forEach(o =&gt; o.setAttribute(&#39;aria-selected&#39;, o === el)); d.open = false; @get(el.href)">Alpha</a>
<a class="fc-multiselect-option" role="option" href="/ui/apps/b" aria-selected="false" data-filter-text="beta b" data-show="!$appSearch.trim() || el.dataset.filterText.includes($appSearch.trim().toLowerCase())" data-on:click__prevent="const d = el.closest(&#39;details&#39;); d.querySelector(&#39;.fc-multiselect-summary&#39;).textContent = el.textContent; d.querySelectorAll(&#39;[role=option]&#39;).forEach(o =&gt; o.setAttribute(&#39;aria-selected&#39;, o === el)); d.open = false; @get(el.href)">Beta</a>
</div>
</div>
</details>
</div>
