<div id="filter-app-field" class="fc-form-field">
<span id="filter-app-label" class="fc-field-label">Applications</span>
<details class="fc-multiselect">
<summary class="fc-select fc-multiselect-trigger" aria-labelledby="filter-app-label filter-app-summary"><span id="filter-app-summary" class="fc-multiselect-summary">All Applications</span></summary>
<div class="fc-multiselect-panel" data-signals:filter-app-q="&#39;&#39;">
<input type="search" class="fc-input fc-multiselect-search" placeholder="Search" aria-label="Search Applications" autocomplete="off" data-bind:filter-app-q>
<div id="filter-app-options" class="fc-multiselect-options" role="listbox" aria-labelledby="filter-app-label">
<a class="fc-multiselect-option" role="option" href="?app=billing" aria-selected="false" data-filter-text="billing" data-show="!$filterAppQ.trim() || el.dataset.filterText.includes($filterAppQ.trim().toLowerCase())" data-on:click="const d = el.closest(&#39;details&#39;); d.querySelector(&#39;.fc-multiselect-summary&#39;).textContent = el.textContent; d.querySelectorAll(&#39;[role=option]&#39;).forEach(o =&gt; o.setAttribute(&#39;aria-selected&#39;, o === el)); d.open = false">billing</a>
<a class="fc-multiselect-option" role="option" href="?app=orders" aria-selected="false" data-filter-text="orders" data-show="!$filterAppQ.trim() || el.dataset.filterText.includes($filterAppQ.trim().toLowerCase())" data-on:click="const d = el.closest(&#39;details&#39;); d.querySelector(&#39;.fc-multiselect-summary&#39;).textContent = el.textContent; d.querySelectorAll(&#39;[role=option]&#39;).forEach(o =&gt; o.setAttribute(&#39;aria-selected&#39;, o === el)); d.open = false">orders</a>
</div>
</div>
</details>
</div>
