<form id="pick-apps" method="post" action="/ui/clients/clt_1/applications" data-signals="{appsPicked: ['', ''], appsQ: ''}" class="grid grid-cols-1 gap-4 sm:grid-cols-2"
      data-init="el.dataset.snapshot = JSON.stringify($appsPicked)" data-on:submit="@post(el.action, {contentType: &#39;form&#39;, retryMaxCount: 0})">

    <div class="h-[200px] overflow-y-auto p-1"><label for="pk-admin" data-show="!$appsQ.trim() || el.dataset.filterText.includes($appsQ.trim().toLowerCase())" data-filter-text="administrator platform:admin" class="flex cursor-pointer items-center justify-between gap-3 rounded-md px-2 py-1.5 hover:bg-foreground/5 has-[:checked]:bg-primary/10"><span class="flex min-w-0 flex-col"><span class="truncate font-medium">Administrator</span><span class="truncate font-mono text-[12px] text-muted-foreground">platform:admin</span></span><span class="peer relative inline-flex shrink-0 has-[:disabled]:opacity-50"><input type="checkbox" class="peer size-4 shrink-0 appearance-none rounded-[4px] border border-input bg-background transition-colors outline-none checked:border-primary checked:bg-primary focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:pointer-events-none" id="pk-admin" name="applicationIds" value="admin" data-bind:apps-picked><svg width="1em" height="1em" class="pointer-events-none absolute inset-0 m-auto size-3.5 text-primary-foreground opacity-0 peer-checked:opacity-100" aria-hidden="true"><use href="/icons/lucide-sprite.svg#i-check"/></svg></span></label><label for="pk-viewer" data-show="!$appsQ.trim() || el.dataset.filterText.includes($appsQ.trim().toLowerCase())" data-filter-text="viewer platform:viewer" class="flex cursor-pointer items-center justify-between gap-3 rounded-md px-2 py-1.5 hover:bg-foreground/5 has-[:checked]:bg-primary/10"><span class="flex min-w-0 flex-col"><span class="truncate font-medium">Viewer</span><span class="truncate font-mono text-[12px] text-muted-foreground">platform:viewer</span><span class="text-[11px] font-semibold tracking-wide text-muted-foreground uppercase">Inactive</span></span><span class="peer relative inline-flex shrink-0 has-[:disabled]:opacity-50"><input type="checkbox" class="peer size-4 shrink-0 appearance-none rounded-[4px] border border-input bg-background transition-colors outline-none checked:border-primary checked:bg-primary focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:pointer-events-none" id="pk-viewer" name="applicationIds" value="viewer" data-bind:apps-picked><svg width="1em" height="1em" class="pointer-events-none absolute inset-0 m-auto size-3.5 text-primary-foreground opacity-0 peer-checked:opacity-100" aria-hidden="true"><use href="/icons/lucide-sprite.svg#i-check"/></svg></span></label></div>
  </div>
  <div class="flex min-w-0 flex-col overflow-hidden rounded-lg border border-border">
    <div class="border-b border-border bg-subtle p-3"><h4 class="text-[12px] font-semibold tracking-wider text-subtle-foreground uppercase">Enabled (<span data-text="$appsPicked.filter(Boolean).length">0</span>)</h4></div>
    <div class="h-[200px] overflow-y-auto p-1"><div data-value="admin" data-show="$appsPicked.includes(el.dataset.value)" style="display: none" class="flex items-center justify-between gap-3 rounded-md px-2 py-1.5"><span class="flex min-w-0 flex-col"><span class="truncate font-medium">Administrator</span><span class="truncate font-mono text-[12px] text-muted-foreground">platform:admin</span></span><label for="pk-admin" title="Remove" aria-label="Remove Administrator" class="inline-flex shrink-0 items-center justify-center border text-sm font-medium whitespace-nowrap transition-colors outline-none select-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:pointer-events-none disabled:opacity-50 border-transparent text-foreground hover:bg-foreground/5 active:bg-foreground/10 size-9 rounded-lg [&]:size-7 [&]:rounded-full cursor-pointer text-destructive"><svg width="1em" height="1em" class="size-[0.9rem]" aria-hidden="true"><use href="/icons/lucide-sprite.svg#i-x"/></svg></label></div><div data-value="viewer" data-show="$appsPicked.includes(el.dataset.value)" style="display: none" class="flex items-center justify-between gap-3 rounded-md px-2 py-1.5"><span class="flex min-w-0 flex-col"><span class="truncate font-medium">Viewer</span><span class="truncate font-mono text-[12px] text-muted-foreground">platform:viewer</span><span class="text-[11px] font-semibold tracking-wide text-muted-foreground uppercase">Inactive</span></span><label for="pk-viewer" title="Remove" aria-label="Remove Viewer" class="inline-flex shrink-0 items-center justify-center border text-sm font-medium whitespace-nowrap transition-colors outline-none select-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:pointer-events-none disabled:opacity-50 border-transparent text-foreground hover:bg-foreground/5 active:bg-foreground/10 size-9 rounded-lg [&]:size-7 [&]:rounded-full cursor-pointer text-destructive"><svg width="1em" height="1em" class="size-[0.9rem]" aria-hidden="true"><use href="/icons/lucide-sprite.svg#i-x"/></svg></label></div><p data-show="$appsPicked.filter(Boolean).length === 0" class="p-3 text-center text-muted-foreground">No applications enabled</p></div>
  </div>
  <div class="sm:col-span-2 flex justify-end gap-2"><button type="submit" disabled data-attr:disabled="JSON.stringify($appsPicked) === el.form.dataset.snapshot" class="inline-flex shrink-0 items-center justify-center border text-sm font-medium whitespace-nowrap transition-colors outline-none select-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:pointer-events-none disabled:opacity-50 border-transparent bg-primary text-primary-foreground shadow-xs hover:bg-primary/90 active:bg-primary/80 h-9 gap-2 rounded-lg px-4"><svg width="1em" height="1em" aria-hidden="true"><use href="/icons/lucide-sprite.svg#i-check"/></svg> Save</button></div>
</form>
