<div id="filter-sub-field" class="fc-form-field">
<span id="filter-sub-label" class="fc-field-label">Subdomains</span>
<details class="fc-multiselect" data-placeholder="All Subdomains" data-max-labels="2" data-many-label="{0} selected" data-on:change="const c = [...el.querySelectorAll(&#x27;.fc-multiselect-option input:checked&#x27;)].map(i =&gt; i.nextElementSibling.textContent); el.querySelector(&#x27;.fc-multiselect-summary&#x27;).textContent = c.length === 0 ? el.dataset.placeholder : c.length &lt;= +el.dataset.maxLabels ? c.join(&#x27;, &#x27;) : el.dataset.manyLabel.replace(&#x27;{0}&#x27;, c.length)">
<summary class="fc-select fc-multiselect-trigger" aria-labelledby="filter-sub-label filter-sub-summary"><span id="filter-sub-summary" class="fc-multiselect-summary">All Subdomains</span></summary>
<div class="fc-multiselect-panel">

<label class="fc-multiselect-option"><input type="checkbox" name="sub" value="execution" data-on:change="@get(&#39;/ui/event-types&#39;, {contentType: &#39;form&#39;})"><span>execution</span></label>
<label class="fc-multiselect-option"><input type="checkbox" name="sub" value="iam" data-on:change="@get(&#39;/ui/event-types&#39;, {contentType: &#39;form&#39;})"><span>iam</span></label>
</div>
</div>
</details>
</div>
