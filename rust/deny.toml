# cargo deny check: supply-chain policy for the Rust framework (design section 2.4, decision 3).
# The framework is Apache-2.0 and open source: permissive licences only, no copyleft (no AGPL, GPL,
# LGPL, nor the file-level MPL), crates.io only.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Only advisories with no fixed version anywhere, each with why it is accepted and when to look
# again. Remove an entry as soon as its crate can be updated or replaced.
ignore = [
    # astral-tokio-tar is unmaintained (2026-11-03), no fixed release. It comes in only through
    # testcontainers (0.27 and the latest, 0.28, both require it), so only through fw-test: test
    # code and the cargo-fw developer tool, never an application. testcontainers uses it to copy
    # files into a container, which fw-test does not do. Look again 2027-02-18, or when a
    # testcontainers release drops it.
    { id = "RUSTSEC-2026-0440", reason = "unmaintained, no fix; via testcontainers in fw-test only; review 2027-02-18" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = false

[bans]
# Duplicate versions are reported, not refused, while the workspace is young.
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "native-tls", reason = "TLS is rustls" },
    { crate = "openssl", reason = "TLS is rustls" },
    { crate = "serde_yaml", reason = "unmaintained; use serde_norway" },
    # Unmaintained (RUSTSEC-2026-0543); the framework's time is jiff (owner, 2026-11-18). It stays
    # in Cargo.lock only as an optional dependency of serde_with that nothing turns on.
    { crate = "chrono", reason = "unmaintained; use jiff" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
