[package]
name = "fw-objectstore"
description = "Object stores (object-stores contract): put, get and delete byte values by key; drivers memory, folder (local and test only) and s3 (feature s3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The `s3` driver: AWS S3 or an S3-compatible service, on the AWS SDK for Rust.
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
# The contract test suite (`testing::suite!`) every driver passes.
testing = []

[dependencies]
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
fw-core = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
fw-objectstore = { path = ".", features = ["testing", "s3"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
