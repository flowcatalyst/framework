[package]
name = "fw-core"
description = "The framework's core: application lifecycle, modules, config, Context and ids, health, background loops, metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# sqlx `Type`/`Encode`/`Decode` for the id types (Id<K>, ClientId, ...), so repositories bind and
# read them directly. Adds impls only.
sqlx = ["dep:sqlx"]

[dependencies]
chrono = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
